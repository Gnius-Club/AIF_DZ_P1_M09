<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Exploradores del Ciber-Océano: La Ruta del Candado Dorado</title>
<style>
  :root {
    --bg: #05192d;
    --panel: #102a43;
    --accent: #00d9ff;
    --gold: #ffcc33;
    --safe: #2ecc71;
    --danger: #e74c3c;
    --text: #ffffff;
  }

  body {
    margin: 0; padding: 0;
    font-family: 'Comic Sans MS', 'Arial', sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
    touch-action: manipulation;
    user-select: none;
  }

  /* --- HUD --- */
  #hud {
    position: absolute;
    top: 0; width: 100%;
    padding: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(0,0,0,0.6);
    z-index: 100;
    box-sizing: border-box;
  }

  .energy-container {
    width: 150px; height: 20px;
    background: #334e68; border-radius: 10px;
    border: 2px solid white; overflow: hidden;
  }

  #energy-bar {
    width: 100%; height: 100%;
    background: linear-gradient(90deg, #2ecc71, #e74c3c);
    transition: width 0.5s ease;
  }

  .controls-right { display: flex; gap: 8px; }

  .btn-circle {
    width: 45px; height: 45px; border-radius: 50%;
    border: none; cursor: pointer; font-size: 1.2rem;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 0 rgba(0,0,0,0.3);
  }

  /* --- Pantallas --- */
  .screen {
    position: absolute; inset: 0;
    display: none; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 20px; text-align: center;
  }
  .screen.active { display: flex; }

  /* --- Mapa y Submarino --- */
  #map-container {
    width: 100%; height: 100%;
    background: radial-gradient(circle, #1b4965 0%, #05192d 100%);
    position: relative;
  }

  .nav-point {
    position: absolute; width: 70px; height: 70px;
    background: white; border-radius: 50%;
    border: 5px solid var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.8rem; font-weight: bold; color: var(--bg);
    cursor: pointer; animation: pulse 2s infinite;
    z-index: 10;
  }

  #submarine {
    position: absolute; width: 90px;
    transition: all 1.2s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 5; pointer-events: none;
  }

  /* --- Modales --- */
  #modal {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.9);
    display: none; z-index: 200;
    justify-content: center; align-items: center;
  }

  .modal-content {
    background: var(--panel); padding: 25px;
    border-radius: 25px; max-width: 600px; width: 85%;
    border: 4px solid var(--accent);
  }

  .option-card {
    background: #243b53; padding: 15px;
    border-radius: 15px; cursor: pointer;
    margin: 10px 0; border: 3px solid transparent;
    display: flex; align-items: center; gap: 15px;
    transition: 0.2s; text-align: left;
  }

  .option-card:hover { border-color: var(--accent); background: #334e68; }

  /* --- Botones --- */
  .btn-ui {
    padding: 15px 30px; border-radius: 50px;
    border: none; font-weight: bold; font-size: 1.2rem;
    cursor: pointer; box-shadow: 0 5px 0 rgba(0,0,0,0.2);
    margin: 10px;
  }

  @keyframes pulse {
    0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(0,217,255,0.7); }
    70% { transform: scale(1.1); box-shadow: 0 0 0 15px rgba(0,217,255,0); }
    100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(0,217,255,0); }
  }

  .hidden { display: none !important; }
</style>
</head>
<body>

  <div id="hud">
    <div>
      <div class="energy-container"><div id="energy-bar"></div></div>
    </div>
    <div class="controls-right">
      <button id="btn-audio" class="btn-circle" onclick="toggleAudio()" title="Activar/Desactivar Audio">🔊</button>
      <button class="btn-circle" style="background:#e67e22" onclick="useFlare()">🚨</button>
      <button class="btn-circle" style="background:#9b59b6" onclick="activatePAR()">💡</button>
    </div>
  </div>

  <!-- INTRODUCCIÓN -->
  <section id="screen-intro" class="screen active">
    <span style="font-size: 5rem;">👨‍✈️</span>
    <h1 id="intro-title">¡Hola, Capitán!</h1>
    <div id="brief-box" style="min-height: 150px;">
      <p id="brief-text">Soy tu Almirante. Pulsa el botón verde para aprender las reglas.</p>
    </div>
    <div style="display:flex; flex-wrap: wrap; justify-content: center;">
      <button id="btn-next" class="btn-ui" style="background:var(--safe)" onclick="nextBriefing()">Siguiente</button>
      <button id="btn-skip" class="btn-ui" style="background:#95a5a6" onclick="skipTutorial()">Saltar Tutorial</button>
    </div>
  </section>

  <!-- MAPA -->
  <section id="screen-map" class="screen">
    <div id="map-container">
      <img src="https://cdn-icons-png.flaticon.com/512/3233/3233845.png" id="submarine" alt="Submarino">
      <div id="p1" class="nav-point" style="left: 15%; top: 60%;" onclick="startChallenge(0)">1</div>
      <div id="p2" class="nav-point" style="left: 45%; top: 30%;" onclick="startChallenge(1)">2</div>
      <div id="p3" class="nav-point" style="left: 75%; top: 65%;" onclick="startChallenge(2)">3</div>
    </div>
  </section>

  <!-- FINAL -->
  <section id="screen-end" class="screen">
    <h1 id="end-title">¡Misión Cumplida!</h1>
    <span id="end-icon" style="font-size: 5rem;">🏝️</span>
    <p id="end-msg"></p>
    <button class="btn-ui" style="background:var(--accent)" onclick="restartGame()">↻ Jugar de Nuevo</button>
  </section>

  <!-- MODAL DE DESAFÍO -->
  <div id="modal">
    <div class="modal-content">
      <h2 id="modal-title" style="color:var(--accent)"></h2>
      <p id="modal-desc" style="font-size: 1.3rem;"></p>
      <div id="options-container"></div>
    </div>
  </div>

<script>
/* --- ESTADO DEL JUEGO --- */
let state = {
  energy: 100,
  audioEnabled: true,
  briefingIndex: 0,
  completedChallenges: [],
  currentChallengeIdx: null
};

const briefingSteps = [
  { text: "Regla 1: El Candado Cerrado Dorado es señal de seguridad. ¡Siempre búscalo!", icon: "🔒" },
  { text: "Regla 2: Los logos de tu escuela son puertos seguros para navegar.", icon: "🏫" },
  { text: "Regla 3: Si ves un candado abierto, ¡cuidado! Puede ser una trampa.", icon: "🔓" },
  { text: "Regla 4: Si algo se ve extraño, usa la Bengala para pedirme ayuda.", icon: "🚨" }
];

const challenges = [
  {
    title: "Las Tres Puertas",
    desc: "¿Por qué puerta debemos pasar para estar seguros?",
    options: [
      { t: "Puerta con Candado Abierto 🔓", ok: false, msg: "¡No! Ese candado está abierto, no es seguro." },
      { t: "Puerta de la Escuela con Candado Dorado 🏫🔒", ok: true, msg: "¡Muy bien! Es un sitio conocido y seguro." },
      { t: "Puerta con una Llave Feliz 😊", ok: false, msg: "¡Cuidado! No tiene candado de seguridad." }
    ]
  },
  {
    title: "Los Cofres Tesoro",
    desc: "Aparecen tres cofres. ¿Cuál es el correcto?",
    options: [
      { t: "Cofre que dice '¡PREMIO GRATIS!' 🎁", ok: false, msg: "¡Trampa! Los premios gratis suelen ser engaños." },
      { t: "Cofre que pide tus datos personales 👤", ok: false, msg: "¡Nunca des tu nombre ni datos a desconocidos!" },
      { t: "Cofre con el Logo de tu Escuela 🏫", ok: true, msg: "¡Exacto! Es un sitio de confianza." }
    ]
  },
  {
    title: "El Gran Remolino",
    desc: "Hay un remolino con un signo de pregunta ❓. ¿Qué haces?",
    options: [
      { t: "Entrar a explorar solo 🌀", ok: false, msg: "Es peligroso entrar a lo desconocido sin ayuda." },
      { t: "Llamar al Almirante con la Bengala 🚨", ok: true, msg: "¡Excelente decisión! Un buen explorador pide ayuda." }
    ]
  }
];

/* --- AUDIO --- */
function speak(text) {
  if (!state.audioEnabled) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'es-ES';
  utter.rate = 1.0;
  window.speechSynthesis.speak(utter);
}

function toggleAudio() {
  state.audioEnabled = !state.audioEnabled;
  const btn = document.getElementById('btn-audio');
  btn.innerText = state.audioEnabled ? "🔊" : "🔇";
  if (!state.audioEnabled) window.speechSynthesis.cancel();
  else speak("Audio activado");
}

/* --- FLUJO TUTORIAL --- */
function nextBriefing() {
  if (state.briefingIndex < briefingSteps.length) {
    const step = briefingSteps[state.briefingIndex];
    document.getElementById('brief-box').innerHTML = `<span style="font-size:4rem">${step.icon}</span><p>${step.text}</p>`;
    speak(step.text);
    state.briefingIndex++;
  } else {
    skipTutorial();
  }
}

function skipTutorial() {
  document.getElementById('screen-intro').classList.remove('active');
  document.getElementById('screen-map').classList.add('active');
  speak("¡Ya estamos en el mapa! Toca el número 1 para empezar.");
  updateSubmarinePosition(0);
}

/* --- DESAFÍOS --- */
function startChallenge(idx) {
  if (state.completedChallenges.includes(idx)) {
    speak("Este camino ya es seguro, Capitán.");
    return;
  }
  
  state.currentChallengeIdx = idx;
  updateSubmarinePosition(idx);
  
  const challenge = challenges[idx];
  setTimeout(() => {
    document.getElementById('modal').style.display = 'flex';
    document.getElementById('modal-title').innerText = challenge.title;
    document.getElementById('modal-desc').innerText = challenge.desc;
    
    // Leer título y descripción
    speak(challenge.title + ". " + challenge.desc);

    const container = document.getElementById('options-container');
    container.innerHTML = '';
    
    challenge.options.forEach((opt, i) => {
      const card = document.createElement('div');
      card.className = 'option-card';
      card.innerHTML = `<span style="font-size:2rem">🔹</span><p>${opt.t}</p>`;
      card.onclick = () => {
        checkAnswer(i);
      };
      container.appendChild(card);
    });
  }, 800);
}

function checkAnswer(optIdx) {
  const opt = challenges[state.currentChallengeIdx].options[optIdx];
  speak(opt.msg);
  
  if (opt.ok) {
    state.completedChallenges.push(state.currentChallengeIdx);
    setTimeout(() => {
      document.getElementById('modal').style.display = 'none';
      if (state.completedChallenges.length === challenges.length) {
        endGame(true);
      }
    }, 2000);
  } else {
    state.energy -= 25;
    updateHUD();
    if (state.energy <= 0) endGame(false);
  }
}

function updateHUD() {
  document.getElementById('energy-bar').style.width = state.energy + "%";
}

function updateSubmarinePosition(idx) {
  const points = [document.getElementById('p1'), document.getElementById('p2'), document.getElementById('p3')];
  const target = points[idx];
  const sub = document.getElementById('submarine');
  sub.style.left = target.style.left;
  sub.style.top = (parseInt(target.style.top) - 8) + "%";
}

/* --- HERRAMIENTAS --- */
function useFlare() {
  speak("¡Bengala de ayuda! El Almirante dice: No te arriesgues ante lo desconocido, ¡pide ayuda siempre!");
}

function activatePAR() {
  speak("Protocolo P.A.R. activado: Parar, Avisar y Respetar. ¡Esa es la clave del éxito!");
}

/* --- FINAL Y REINICIO --- */
function endGame(victory) {
  document.getElementById('screen-map').classList.remove('active');
  document.getElementById('modal').style.display = 'none';
  document.getElementById('screen-end').classList.add('active');
  
  if (victory) {
    document.getElementById('end-title').innerText = "¡Explorador Maestro!";
    document.getElementById('end-icon').innerText = "🏝️";
    document.getElementById('end-msg').innerText = "¡Increíble! Has llegado a la Isla del Tesoro Educativo.";
    speak("¡Misión cumplida! Eres un Explorador Maestro del Ciber-Océano.");
  } else {
    document.getElementById('end-title').innerText = "Submarino sin Energía";
    document.getElementById('end-icon').innerText = "⚓";
    document.getElementById('end-msg').innerText = "Caíste en muchas trampas. ¡Inténtalo de nuevo!";
    speak("Se agotó la energía. Regresemos al puerto para practicar más.");
  }
}

function restartGame() {
  // Reiniciar estado
  state.energy = 100;
  state.briefingIndex = 0;
  state.completedChallenges = [];
  state.currentChallengeIdx = null;
  
  // Reiniciar UI
  updateHUD();
  document.getElementById('screen-end').classList.remove('active');
  document.getElementById('screen-intro').classList.add('active');
  document.getElementById('brief-box').innerHTML = `<p>Soy tu Almirante. Pulsa el botón verde para aprender las reglas.</p>`;
  
  speak("¡Hola de nuevo! Vamos a prepararnos otra vez.");
}

// Iniciar con gesto del usuario (obligatorio para audio en navegadores)
document.addEventListener('click', function init() {
  speak("Bienvenido Capitán.");
  document.removeEventListener('click', init);
}, { once: true });

</script>
</body>
</html>
